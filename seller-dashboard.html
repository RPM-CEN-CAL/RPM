<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seller Portal | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 p-4 flex justify-between items-center max-w-6xl mx-auto">
    <a href="index.html" class="text-xl font-bold text-blue-500">RPM Equipment</a>
    <a href="index.html" class="text-sm text-slate-400 hover:text-white">Back to Site</a>
  </header>

  <main class="max-w-5xl mx-auto p-6 space-y-8">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-white">Seller & Partner Dashboard</h1>
        <p class="text-slate-400 text-sm">Manage your active listings, credits, and B2B business details.</p>
      </div>
      <a href="post-gateway.html" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg text-sm">+ New Post</a>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h2 class="text-lg font-bold text-blue-400 mb-2">My Equipment Listings</h2>
        <div id="equipmentList" class="space-y-3 text-sm text-slate-300">Loading listings...</div>
      </div>

      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h2 class="text-lg font-bold text-blue-400 mb-2">My B2B Business Listing</h2>
        <div id="b2bList" class="space-y-3 text-sm text-slate-300">Loading business details...</div>
      </div>
    </div>
  </main>

  <script>
    async function loadDashboard() {
      try {
        const reqE = await fetch('https://rpm-qhrz.onrender.com/api/listings');
        const equipment = await reqE.json();
        const eBox = document.getElementById('equipmentList');
        
        if (equipment.length === 0) {
          eBox.innerHTML = '<p class="text-slate-500">No active equipment listings.</p>';
        } else {
          eBox.innerHTML = equipment.slice(-3).map(e => 
            <div class="bg-slate-900 p-3 rounded flex justify-between items-center border border-slate-800">
              <div>
                <p class="font-bold text-white">\</p>
                <p class="text-xs text-slate-400">\$\ • \</p>
              </div>
              <a href="post-gateway.html" class="text-xs text-blue-400 hover:underline">Edit</a>
            </div>
          ).join('');
        }

        const reqB = await fetch('https://rpm-qhrz.onrender.com/api/b2b-listings');
        const b2b = await reqB.json();
        const bBox = document.getElementById('b2bList');

        if (b2b.length === 0) {
          bBox.innerHTML = '<p class="text-slate-500">No active B2B business promotion.</p>';
        } else {
          bBox.innerHTML = b2b.slice(-1).map(b => 
            <div class="bg-slate-900 p-3 rounded space-y-2 border border-slate-800">
              <p class="font-bold text-white">\</p>
              <p class="text-xs text-slate-400">\</p>
              <a href="promote-business.html" class="inline-block text-xs bg-blue-600 text-white px-3 py-1 rounded">Update Business Details</a>
            </div>
          ).join('');
        }
      } catch(err) {
        console.error(err);
      }
    }
    loadDashboard();
  </script>
</body>
</html>
