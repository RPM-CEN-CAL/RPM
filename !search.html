<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Equipment | Pro Equipment Exchange</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Arial, sans-serif; background:#f5f5f5; color:#222; }

header {
    position:fixed; top:0; width:100%; height:70px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px;
    background:linear-gradient(to right,#0033a0,#ffffff,#0033a0);
    border-bottom:2px solid #222; z-index:1000;
}
.header-left { font-size:1.8rem; cursor:pointer; background:rgba(255,255,255,0.3); padding:6px 12px; border-radius:4px; }
.header-center { font-weight:bold; font-size:1.2rem; text-align:center; flex:1; }
.header-right a { text-decoration:none; color:#000; font-weight:600; background:rgba(255,255,255,0.4); padding:6px 10px; border-radius:4px; }

.side-menu {
    position:fixed; top:70px; left:-260px; width:260px; height:100%;
    background:#fff; box-shadow:3px 0 10px rgba(0,0,0,0.25);
    padding:20px; transition:0.3s; z-index:2000;
}
.side-menu ul { list-style:none; }
.side-menu li { margin-bottom:15px; }
.dropdown-btn {
    width:100%; background:#0033a0; color:#fff; padding:10px;
    border:none; text-align:left; font-size:1rem; border-radius:6px; cursor:pointer;
}
.dropdown-container {
    display:none; background:#f5f5f5; padding:10px; border-radius:6px; margin-top:5px;
}
.dropdown-container a {
    display:block; padding:6px 0; text-decoration:none; color:#222; font-size:0.95rem;
}
.dropdown-container a:hover { color:#0033a0; }
.menu-open { left:0; }

main { padding-top:100px; width:100%; max-width:1100px; margin:auto; }

section {
    background:#fff;
    margin:20px auto;
    padding:25px 20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    width:90%;
    max-width:900px;
    border-left:10px solid #0033a0;
}
section h2 {
    margin-bottom:12px; font-size:1.6rem; font-weight:bold; text-align:center; color:#0033a0;
}
input {
    width:100%; padding:12px; font-size:1rem; border:2px solid #ccc; border-radius:6px;
}
.result {
    padding:15px; border-bottom:1px dashed #ccc;
}
.result:last-child { border-bottom:none; }
.result h3 { margin-bottom:8px; }
.price { font-weight:bold; color:#0033a0; }
.location { font-style:italic; color:#555; }
</style>
</head>

<body>

<header>
    <div class="header-left">â˜°</div>
    <div class="header-center">The Valley's Choice</div>
    <div class="header-right">
        <a href="mailto:proequipmentexchange@gmail.com?subject=Customer%20Inquiry&body=Please%20describe%20your%20issue%20or%20request:">Email Us</a>
    </div>
</header>

<div id="sideMenu" class="side-menu">
    <ul>
        <li>
            <button class="dropdown-btn">Buy Equipment â–¼</button>
            <div class="dropdown-container">
                <a href="heavy-equipment.html">Heavy Equipment</a>
                <a href="tools.html">Tools</a>
                <a href="vehicles.html">Vehicles</a>
                <a href="attachments.html">Attachments</a>
            </div>
        </li>
        <li>
            <button class="dropdown-btn">Sell Equipment â–¼</button>
            <div class="dropdown-container">
                <a href="pricing.html">Pricing Guide</a>
                <a href="sellertips.html">Seller Tips</a>
                <a href="membership.html">Membership Info</a>
                <a href="online-payment.html">Online Payment & Delivery</a>
            </div>
        </li>
        <li><a href="search.html">Search Equipment</a></li>
        <li><a href="pricing.html">Pricing Guide</a></li>
        <li><a href="sellertips.html">Seller Tips</a></li>
        <li><a href="membership.html">Membership</a></li>
        <li><a href="online-payment.html">Online Payment</a></li>
        <li><a href="index.html">Home</a></li>
    </ul>
</div>

<main>
    <section>
        <h2>Search Equipment</h2>
        <p>Search by name or keyword.</p>

        <input id="searchBox" type="text" placeholder="Search equipment...">
        <div id="results"></div>
    </section>
</main>

<script>
const menuBtn = document.querySelector('.header-left');
const sideMenu = document.getElementById('sideMenu');
const dropdowns = document.getElementsByClassName("dropdown-btn");

menuBtn.addEventListener('click', () => {
    sideMenu.classList.toggle('menu-open');
});

for (let i = 0; i < dropdowns.length; i++) {
    dropdowns[i].addEventListener("click", function () {
        const container = this.nextElementSibling;
        container.style.display = container.style.display === "block" ? "none" : "block";
    });
}

const listings = [
    { name: "Skid Steer Loader", price: "$24,500", location: "Visalia, CA", page: "heavy-equipment.html#skidsteer" },
    { name: "Excavator", price: "$68,000", location: "Fresno, CA", page: "heavy-equipment.html#excavator" },
    { name: "Bulldozer", price: "$92,000", location: "Bakersfield, CA", page: "heavy-equipment.html#dozer" },
    { name: "Air Compressor", price: "$450", location: "Tulare, CA", page: "tools.html#compressor" },
    { name: "Work Truck", price: "$18,000", location: "Visalia, CA", page: "vehicles.html#truck" },
    { name: "Bucket Attachment", price: "$1,200", location: "Visalia, CA", page: "attachments.html#bucket" }
];

document.getElementById("searchBox").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    const filtered = listings.filter(item =>
        item.name.toLowerCase().includes(query)
    );

    filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = "result";
        div.innerHTML = `
            <h3><a href="${item.page}">${item.name}</a></h3>
            <p class="price">${item.price}</p>
            <p class="location">${item.location}</p>
        `;
        resultsDiv.appendChild(div);
    });
});

async function loadListings(category) {
    try {
        const response = await fetch("listings.json");
        if (!response.ok) return [];
        const data = await response.json();
        return data[category] || [];
    } catch (error) {
        console.error("Error loading listings:", error);
        return [];
    }
}
</script>

</body>
</html>
