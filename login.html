<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login | Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
  <script>
    const supabase = supabase.createClient(
      "https://qfjilrbhbcqwlrrwihcy.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmamlscmJoYmNxd2xycndpaGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDgyMTcsImV4cCI6MjA4NjkyNDIxN30.SWnM-6ls0nTanHkaCViwQ-LbTFqrKo_qlKnhGTRMKa0"
    );
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center py-12 px-4">

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-extrabold text-white">Sign In to Your Account</h1>
      <p class="text-xs text-slate-400">Access seller portals, saved inventory, and messages</p>
    </div>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Email Address</label>
        <input id="email" type="email" placeholder="name@company.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Password</label>
        <input id="password" type="password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
      </div>

      <button id="submitBtn" type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg shadow-lg shadow-blue-600/30 transition-all mt-2">
        Continue &rarr;
      </button>
    </form>

    <div class="text-center pt-4 border-t border-slate-700/60">
      <p class="text-xs text-slate-400">Don't have an account? <a href="membership.html" class="text-blue-400 font-semibold hover:underline">Register here</a></p>
    </div>
  </div>

  <script>
    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.innerText = "Signing in...";

      // Save user email to local storage for quick portal session lookup
      localStorage.setItem("rpm_user_email", email);

      let { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        // Fallback: create account if it doesn't exist
        let { error: signupError } = await supabase.auth.signUp({ email, password });
        if (signupError) {
          alert("Login error: " + signupError.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "Continue →";
          return;
        }
      }

      // Redirect directly to the Client Portal / Dashboard
      window.location.href = "seller-dashboard.html";
    });
  </script>
</body>
</html>
