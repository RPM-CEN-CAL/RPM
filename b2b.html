<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Promotion | Commercial Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
  <script>
    const supabase = supabase.createClient(
      "https://qfjilrbhbcqwlrrwihcy.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmamlscmJoYmNxd2xycndpaGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDgyMTcsImV4cCI6MjA4NjkyNDIxN30.SWnM-6ls0nTanHkaCViwQ-LbTFqrKo_qlKnhGTRMKa0"
    );
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center py-12 px-4">

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-extrabold text-white">Promote Your Business</h1>
      <p class="text-xs text-slate-400">List your commercial services for only $2</p>
    </div>

    <form id="b2bForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Business Name</label>
        <input type="text" id="businessName" placeholder="e.g. Apex Industrial Solutions" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500" required>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Contact Info</label>
        <input type="text" id="contactInfo" placeholder="Phone, Email, or Web address" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500" required>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Services Description</label>
        <textarea id="services" rows="4" placeholder="Describe fleet maintenance, equipment rental, or logistics..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500" required></textarea>
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg shadow-lg transition-all mt-2">
        Submit & Pay $2 &rarr;
      </button>
    </form>
  </div>

  <script>
    document.getElementById("b2bForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const userResponse = await supabase.auth.getUser();
      const user = userResponse.data ? userResponse.data.user : null;

      if (!user) {
        alert("You must be logged in to submit a B2B listing.");
        window.location.href = "login.html";
        return;
      }

      const businessName = document.getElementById("businessName").value;
      const contactInfo = document.getElementById("contactInfo").value;
      const services = document.getElementById("services").value;

      const { data, error } = await supabase.from("b2b_listings").insert({
        user_id: user.id,
        business_name: businessName,
        contact_info: contactInfo,
        services: services,
        created_at: new Date().toISOString(),
        is_active: false
      });

      if (error) {
        alert("Error submitting listing: " + error.message);
        return;
      }

      window.location.href = "b2b-payment.html";
    });
  </script>
</body>
</html>
