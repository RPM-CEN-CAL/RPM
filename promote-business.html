<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promote Your Business | RPM B2B Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col group">
        <div class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg font-mono text-sm">RPM</span>
          <span class="group-hover:text-blue-400 transition-colors">EQUIPMENT</span>
        </div>
        <span class="text-[10px] sm:text-xs font-semibold text-slate-400 tracking-tight">
          Commercial B2B Directory
        </span>
      </a>
      <a href="b2b.html" class="text-xs text-slate-400 hover:text-white">&larr; Back to Directory</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-12">
    <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-8 shadow-xl space-y-6">
      <div>
        <h1 class="text-2xl font-bold text-white">Promote Your Business</h1>
        <p class="text-xs text-slate-400 mt-1">Get your company listed on the Central Valley commercial directory ($2.00 flat fee).</p>
      </div>

      <form id="businessForm" class="space-y-4">
        
        <!-- Company Name -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Company / Business Name *</label>
          <input type="text" id="companyName" required placeholder="e.g. Central Valley Fleet Services" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Email & Phone -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Contact Email *</label>
            <input type="email" id="email" required placeholder="yourname@business.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Business Phone</label>
            <input type="tel" id="phone" placeholder="(555) 000-0000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <!-- Category Dropdown & Custom Category -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Category *</label>
          <select id="categorySelect" onchange="toggleCustomCategory(this)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
            <option value="Commercial Contractor">Commercial Contractor</option>
            <option value="Fleet Maintenance & Repair">Fleet Maintenance & Repair</option>
            <option value="Equipment Dealer & Sales">Equipment Dealer & Sales</option>
            <option value="Property & Inspections">Property & Inspections</option>
            <option value="Residential Inspections">Residential Inspections</option>
            <option value="Hauling & Logistics">Hauling & Logistics</option>
            <option value="Heavy Machinery Services">Heavy Machinery Services</option>
            <option value="Industrial Supplies & Tools">Industrial Supplies & Tools</option>
            <option value="Agricultural Services">Agricultural Services</option>
            <option value="OTHER">-- Add Custom / Special Category --</option>
          </select>
        </div>

        <div id="customCategoryContainer" class="hidden">
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">Specify Custom Category *</label>
          <input type="text" id="customCategoryInput" placeholder="Enter custom category" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>

        <!-- Website & Location -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Website / Social Link</label>
            <input type="url" id="website" placeholder="https://yourbusiness.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Service Area / City</label>
            <input type="text" id="location" placeholder="e.g. Visalia, CA / Central Valley" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <!-- Business Logo / Image Drag & Drop Upload -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Company Logo / Banner Image</label>
          <div 
            id="dropZone"
            class="border-2 border-dashed border-slate-700 rounded-lg p-6 text-center bg-slate-900/50 hover:border-emerald-500 transition-colors cursor-pointer"
            onclick="document.getElementById('fileInput').click()"
            ondragover="handleDragOver(event)"
            ondragleave="handleDragLeave(event)"
            ondrop="handleDrop(event)"
          >
            <svg class="mx-auto h-10 w-10 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-sm font-medium text-slate-200">Drag & drop image here, or <span class="text-emerald-400 underline">browse files</span></p>
            <p class="text-xs text-slate-500 mt-1">Supports PNG, JPG, JPEG, WEBP, GIF, SVG</p>
            
            <input 
              type="file" 
              id="fileInput" 
              accept="image/png, image/jpeg, image/jpg, image/webp, image/gif, image/svg+xml" 
              class="hidden" 
              onchange="handleFileUpload(this.files)"
            >
          </div>

          <!-- Preview Container -->
          <div id="previewContainer" class="hidden mt-3 p-3 bg-slate-900 border border-slate-700 rounded-lg flex items-center justify-between">
            <div class="flex items-center gap-3">
              <img id="imagePreview" src="" alt="Preview" class="h-12 w-12 object-cover rounded-md border border-slate-700">
              <div>
                <p id="fileName" class="text-xs font-semibold text-white"></p>
                <p id="fileSize" class="text-[10px] text-slate-400"></p>
              </div>
            </div>
            <button type="button" onclick="removeSelectedFile()" class="text-xs text-rose-400 hover:text-rose-300 font-semibold px-2.5 py-1 bg-rose-500/10 rounded border border-rose-500/20">Remove</button>
          </div>

          <!-- Hidden Input for Database / Backend Payload -->
          <input type="hidden" id="imageUrl">
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Business Description *</label>
          <textarea id="description" rows="4" required placeholder="Describe your commercial services, specialization, and offerings..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
        </div>

        <!-- Hidden flat rate price -->
        <input type="hidden" id="selectedTierPrice" value="2">

        <!-- Fixed $2.00 Submission -->
        <button type="submit" id="payBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-lg text-sm transition-all shadow-lg flex items-center justify-center gap-2 mt-6">
          <span>Pay $2.00 & Post Business</span> &rarr;
        </button>
      </form>
    </div>
  </main>

  <script>
    function toggleCustomCategory(select) {
      const customContainer = document.getElementById('customCategoryContainer');
      const customInput = document.getElementById('customCategoryInput');
      if (select.value === 'OTHER') {
        customContainer.classList.remove('hidden');
        customInput.required = true;
      } else {
        customContainer.classList.add('hidden');
        customInput.required = false;
        customInput.value = '';
      }
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.add('border-emerald-500', 'bg-slate-800');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.remove('border-emerald-500', 'bg-slate-800');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.remove('border-emerald-500', 'bg-slate-800');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFileUpload(e.dataTransfer.files);
      }
    }

    function handleFileUpload(files) {
      const file = files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('Please upload a valid image file (PNG, JPG, WEBP, GIF, SVG).');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('imageUrl').value = e.target.result;
        document.getElementById('imagePreview').src = e.target.result;
        document.getElementById('fileName').innerText = file.name;
        document.getElementById('fileSize').innerText = `${(file.size / 1024).toFixed(1)} KB`;
        document.getElementById('previewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeSelectedFile() {
      document.getElementById('fileInput').value = '';
      document.getElementById('imageUrl').value = '';
      document.getElementById('previewContainer').classList.add('hidden');
    }
  </script>
  <script src="app_2.js"></script>
</body>
</html>
