<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promote Your Business | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">

  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-black text-white text-lg tracking-tight">RPM EQUIPMENT</a>
      <a href="b2b.html" class="text-xs text-blue-400 hover:underline">&larr; Back to B2B Directory</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <div class="bg-slate-800/80 border border-slate-700 p-8 rounded-2xl shadow-xl space-y-6">
      <div>
        <h1 class="text-2xl font-bold text-white">List Your Business in the B2B Directory</h1>
        <p class="text-xs text-slate-400 mt-1">Get your dealership, hauling service, or contracting business seen by regional buyers.</p>
      </div>

      <form id="businessForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Company / Business Name</label>
          <input type="text" id="title" placeholder="e.g. Central Valley Equipment Repair & Hauling" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" required>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Industry Sector</label>
            <select id="category" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
              <option value="Commercial Services">Commercial Services & Repair</option>
              <option value="Equipment Dealership">Equipment Dealership</option>
              <option value="Hauling & Logistics">Hauling & Logistics</option>
              <option value="Ag & Farm Contracting">Ag & Farm Contracting</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Contact Email</label>
            <input type="email" id="email" placeholder="contact@yourcompany.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" required>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Logo / Banner Image URL</label>
          <input type="url" id="imageUrl" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
          <p class="text-[10px] text-slate-500 mt-1">Leave blank to use a standard industry banner placeholder.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Business Overview & Services Offered</label>
          <textarea id="description" rows="4" placeholder="Describe your service area, machinery specialization, or fleet size..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg shadow-lg transition-all text-sm">
          Submit Business Profile &rarr;
        </button>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('businessForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Publishing to Directory...';
      btn.disabled = true;

      const payload = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        email: document.getElementById('email').value,
        imageUrl: document.getElementById('imageUrl').value || 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=800&q=80',
        description: document.getElementById('description').value,
        price: 'B2B Partner',
        condition: 'Verified Business'
      };

      try {
        const res = await fetch('https://rpm-qhrz.onrender.com/api/listings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('Business listing successfully published!');
          window.location.href = 'b2b.html';
        } else {
          alert('Failed to publish profile. Please check connection.');
        }
      } catch (err) {
        console.error(err);
        alert('Server error. Please try again in a moment.');
      } finally {
        btn.innerText = 'Submit Business Profile \u2192';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
