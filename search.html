<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPM Equipment | Equipment Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col group">
        <div class="text-2xl font-black text-white flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg font-mono text-sm">RPM</span>
          <span>EQUIPMENT</span>
        </div>
      </a>
      <a href="index.html" class="text-sm font-medium text-blue-400 hover:underline">&larr; Back to Home</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-16 text-center space-y-6">
    <h1 class="text-3xl sm:text-5xl font-black text-white">Equipment Search</h1>
    <p class="text-slate-400 text-sm">Search across heavy machinery, ag equipment, and commercial vehicles.</p>
    
    <div class="flex max-w-md mx-auto gap-2">
      <input type="text" placeholder="Search tractors, trailers, haulers..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-xs text-white focus:outline-none focus:border-blue-500">
      <a href="index.html" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3 rounded-lg text-xs flex items-center">Search</a>
    </div>
  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-slate-500 text-xs">
    &copy; RPM Equipment Marketplace. All rights reserved.
  </footer>
</body>
</html>
