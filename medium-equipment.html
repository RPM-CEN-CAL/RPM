<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medium Equipment | RPM Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col group">
        <div class="text-2xl font-black text-white flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg font-mono text-sm">RPM</span>
          <span>MEDIUM EQUIPMENT</span>
        </div>
      </a>
      <a href="seller-dashboard.html" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-xs">+ Post Equipment</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-12 w-full space-y-8">
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-black text-white">Medium Duty Equipment</h1>
      <p class="text-slate-400 text-sm">Skid steers, compact tractors, trailers, and utility machinery.</p>
    </div>

    <div id="loading" class="text-center py-12 text-slate-400">Loading catalog...</div>
    <div id="grid" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
    &copy; 2026 RPM Equipment. All rights reserved.
  </footer>

  <script>
    async function fetchListings() {
      try {
        const res = await fetch('https://rpm-qhrz.onrender.com/api/listings');
        const items = await res.json();
        const grid = document.getElementById('grid');
        document.getElementById('loading').classList.add('hidden');
        grid.classList.remove('hidden');

        const filtered = items.filter(i => (i.category || '').toLowerCase().includes('medium') || (i.category || '').toLowerCase().includes('tools'));
        
        if (filtered.length === 0) {
          grid.innerHTML = '<p class="col-span-full text-center text-slate-400">No medium equipment listings found.</p>';
          return;
        }

        grid.innerHTML = filtered.map(item => `
          <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden flex flex-col justify-between">
            <div class="h-48 bg-slate-700">
              <img src="${item.imageUrl || 'Tools.jpg'}" alt="${item.title}" class="w-full h-full object-cover">
            </div>
            <div class="p-4 space-y-2">
              <span class="text-xs bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded border border-blue-500/30">${item.category}</span>
              <h3 class="font-bold text-white text-lg">${item.title}</h3>
              <p class="text-blue-400 font-extrabold text-xl">$${item.price}</p>
              <a href="equipment-detail.html?id=${item.id}" class="block text-center bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg text-xs mt-3">View Details</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('loading').textContent = 'Error fetching equipment.';
      }
    }
    fetchListings();
  </script>
</body>
</html>
