<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing Details | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-xl font-bold text-white tracking-tight">RPM <span class="text-blue-500">EQUIPMENT</span></span>
      </a>
      <a href="javascript:history.back()" class="text-sm text-blue-400 hover:underline">&larr; Back to Listings</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-12 w-full">
    <div id="loading" class="text-center py-20 text-slate-400">Loading item details...</div>
    <div id="errorState" class="hidden text-center py-20 text-red-400">Listing not found or server error.</div>

    <div id="detailContainer" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
      <div class="space-y-4">
        <div class="h-72 bg-slate-800 rounded-xl overflow-hidden border border-slate-700/50">
          <img id="itemImage" src="" alt="Equipment Image" class="w-full h-full object-cover">
        </div>
      </div>

      <div class="space-y-6 flex flex-col justify-between">
        <div class="space-y-3">
          <span id="itemCategory" class="inline-block bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs font-bold px-2.5 py-1 rounded-full uppercase"></span>
          <h1 id="itemTitle" class="text-2xl sm:text-3xl font-black text-white"></h1>
          <p id="itemPrice" class="text-3xl font-extrabold text-blue-400"></p>
          <hr class="border-slate-800">
          <p id="itemDescription" class="text-slate-300 text-sm leading-relaxed"></p>
        </div>

        <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
          <h3 class="text-sm font-bold text-white">Interested in this item?</h3>
          <a id="contactBtn" href="seller-dashboard.html" class="block text-center bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-lg text-sm transition-all">
            Contact Seller / Inquire
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500">
    &copy; 2026 RPM Equipment. All rights reserved.
  </footer>

  <script>
    async function loadItemDetail() {
      const params = new URLSearchParams(window.location.search);
      const itemId = params.get('id');

      if (!itemId) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`https://rpm-qhrz.onrender.com/api/listings/${itemId}`);
        if (!res.ok) throw new Error('Not found');

        const data = await res.json();

        document.getElementById('itemTitle').textContent = data.title || 'Untitled Listing';
        document.getElementById('itemCategory').textContent = data.category || 'General';
        document.getElementById('itemPrice').textContent = `$${data.price || 0}`;
        document.getElementById('itemDescription').textContent = data.description || 'No description provided.';
        document.getElementById('itemImage').src = data.imageUrl || 'Tools.jpg';

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('detailContainer').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
      }
    }

    loadItemDetail();
  </script>
</body>
</html>
