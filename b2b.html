<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Directory | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased">

  <header class="border-b border-slate-800 bg-slate-900/95 sticky top-0 z-50 py-4 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <span class="bg-blue-600 text-white px-3 py-0.5 rounded-xl font-mono text-base font-black shadow-lg">RPM</span>
        <span class="text-xl font-extrabold text-white">B2B DIRECTORY</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="promote-business.html" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all">
          + Promote Business
        </a>
        <a href="login.html" class="text-xs font-semibold text-slate-400 hover:text-white px-3 py-2 bg-slate-800 rounded-lg">
          Client Portal
        </a>
        <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-white px-3 py-2">
          ← Home
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8 w-full">
    <div class="text-center space-y-3 max-w-2xl mx-auto">
      <h1 class="text-3xl sm:text-4xl font-black text-white">Commercial B2B Directory</h1>
      <p class="text-xs sm:text-sm text-slate-400">Connect with verified equipment contractors, logistics partners, and commercial repair services nationwide.</p>
    </div>

    <div id="b2b-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full p-12 bg-slate-800/40 rounded-2xl border border-slate-800 text-center text-slate-400 text-sm">
        Loading verified B2B service listings...
      </div>
    </div>
  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    © 2026 RPM Equipment. All rights reserved.
  </footer>

  <script>
    async function loadB2BDirectory() {
      const container = document.getElementById('b2b-container');
      try {
        const response = await fetch('https://rpm-qhrz.onrender.com/api/b2b');
        const data = await response.json();
        const listings = Array.isArray(data) ? data : (data.listings || []);

        if (!listings.length) {
          container.innerHTML = `
            <div class="col-span-full p-12 bg-slate-800/40 rounded-2xl border border-slate-800 text-center text-slate-400 text-sm">
              No active B2B listings registered yet. Be the first to promote your business above!
            </div>
          `;
          return;
        }

        container.innerHTML = listings.map(biz => `
          <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between space-y-4 shadow-xl">
            <div class="space-y-2">
              <div class="flex justify-between items-center">
                <span class="bg-blue-500/20 text-blue-400 text-[10px] font-extrabold px-2.5 py-1 rounded-md uppercase tracking-wider">Verified Partner</span>
                <span class="text-[10px] text-slate-400 font-semibold">${biz.phone || ''}</span>
              </div>
              <h2 class="text-xl font-bold text-white">${biz.companyName || biz.title || 'Verified Provider'}</h2>
              <p class="text-xs font-semibold text-blue-400">${biz.services || 'General Commercial Services'}</p>
              <p class="text-xs text-slate-300 leading-relaxed">${biz.description || ''}</p>
            </div>
            <a href="mailto:${biz.email || ''}" class="w-full block text-center bg-slate-700 hover:bg-blue-600 text-white font-bold text-xs py-2.5 rounded-xl transition-colors">
              Contact Business
            </a>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `
          <div class="col-span-full p-12 bg-slate-800/40 rounded-2xl border border-slate-800 text-center text-slate-400 text-sm">
            No active B2B listings registered yet. Be the first to promote your business above!
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadB2BDirectory);
  </script>
</body>
</html>
