<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promote Your Business | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">

  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-black text-white text-lg tracking-tight">RPM EQUIPMENT</a>
      <a href="b2b.html" class="text-xs text-blue-400 hover:underline">&larr; Back to B2B Directory</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <div class="bg-slate-800/80 border border-slate-700 p-8 rounded-2xl shadow-xl space-y-6">
      <div>
        <h1 class="text-2xl font-bold text-white">List Your Business in the B2B Directory</h1>
        <p class="text-xs text-slate-400 mt-1">Get your dealership, hauling service, or contracting business seen by regional buyers ($2 listing fee).</p>
      </div>

      <form id="businessForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Company / Business Name</label>
          <input type="text" id="title" placeholder="e.g. RPM Inspections" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" required>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Industry Sector</label>
            <select id="categorySelect" onchange="toggleCustomSector(this)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
              <option value="Commercial Services & Repair">Commercial Services & Repair</option>
              <option value="Equipment Inspections & Audits">Equipment Inspections & Audits</option>
              <option value="Equipment Dealership & Sales">Equipment Dealership & Sales</option>
              <option value="Hauling, Towing & Logistics">Hauling, Towing & Logistics</option>
              <option value="Ag & Farm Contracting">Ag & Farm Contracting</option>
              <option value="Construction & Excavation">Construction & Excavation</option>
              <option value="Machinery Rental & Leasing">Machinery Rental & Leasing</option>
              <option value="Parts, Tyres & Attachments">Parts, Tires & Attachments</option>
              <option value="Industrial Maintenance & Fabrication">Industrial Maintenance & Fabrication</option>
              <option value="Auction & Valuation Services">Auction & Valuation Services</option>
              <option value="Custom Sector">Other / Custom Sector...</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Contact Email</label>
            <input type="email" id="email" placeholder="contact@yourcompany.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" required>
          </div>
        </div>

        <!-- Custom Sector Input -->
        <div id="customSectorContainer" class="hidden">
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">Specify Custom Industry Sector</label>
          <input type="text" id="customSectorInput" placeholder="e.g. Home Inspections" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>

        <!-- File Upload / Drop Zone -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Upload Logo or Banner Image</label>
          <div class="border-2 border-dashed border-slate-700 hover:border-blue-500 bg-slate-900 rounded-lg p-4 text-center cursor-pointer transition-colors relative" id="dropZone">
            <input type="file" id="imageFileInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="handleFileSelect(event)">
            <p class="text-xs text-slate-400" id="uploadText">📁 Click to upload or drag & drop image here</p>
            <p class="text-[10px] text-slate-500 mt-1">PNG, JPG, or WEBP up to 5MB</p>
          </div>
          
          <div class="mt-2">
            <input type="url" id="imageUrl" placeholder="Or paste Image URL (https://...)" class="w-full bg-slate-900/50 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Business Overview & Services Offered</label>
          <textarea id="description" rows="4" placeholder="Describe your service area, machinery specialization, or fleet size..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg shadow-lg transition-all text-sm">
          Pay $2 & Publish Listing &rarr;
        </button>
      </form>
    </div>
  </main>

  <script>
    let uploadedBase64Image = '';

    function toggleCustomSector(selectElement) {
      const customContainer = document.getElementById('customSectorContainer');
      if (selectElement.value === 'Custom Sector') {
        customContainer.classList.remove('hidden');
      } else {
        customContainer.classList.add('hidden');
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        if (file.size > 5 * 1024 * 1024) {
          alert('File size exceeds 5MB. Please select a smaller image.');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            // Compress image using HTML Canvas to prevent payload freeze
            const canvas = document.createElement('canvas');
            const maxDim = 800;
            let width = img.width;
            let height = img.height;

            if (width > height && width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            } else if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            uploadedBase64Image = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('uploadText').innerText = `✅ Loaded & Compressed: ${file.name}`;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('businessForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Processing & Redirecting to Square...';
      btn.disabled = true;

      // Determine Category
      const categorySelect = document.getElementById('categorySelect').value;
      const customSectorInput = document.getElementById('customSectorInput').value.trim();
      const finalCategory = (categorySelect === 'Custom Sector' && customSectorInput !== '') 
        ? customSectorInput 
        : categorySelect;

      // Determine Image
      const imageUrlInput = document.getElementById('imageUrl').value.trim();
      const defaultBanner = 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=800&q=80';
      const finalImage = uploadedBase64Image || imageUrlInput || defaultBanner;

      const payload = {
        title: document.getElementById('title').value,
        category: finalCategory,
        email: document.getElementById('email').value,
        imageUrl: finalImage,
        description: document.getElementById('description').value,
        price: 'B2B Partner',
        condition: 'Verified Business'
      };

      try {
        const res = await fetch('https://rpm-qhrz.onrender.com/api/listings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          // Replace with your active Square payment link
          window.location.href = 'https://square.link/u/REPLACE_WITH_YOUR_SQUARE_LINK';
        } else {
          alert('Failed to publish profile. Please verify your entries.');
          btn.innerText = 'Pay $2 & Publish Listing \u2192';
          btn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        alert('Server connection error. Please try again.');
        btn.innerText = 'Pay $2 & Publish Listing \u2192';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
