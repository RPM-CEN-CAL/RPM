<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payment | Pro Equipment Exchange</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
.grid {
  max-width:800px; margin:auto;
  display:grid; grid-template-columns:repeat(2,1fr); gap:20px;
}
.card {
  background:#fff; padding:15px; border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}
button {
  margin-top:10px; width:100%; padding:10px;
  background:#0033a0; color:#fff; border:none; border-radius:6px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">Choose Your Listing Tier</h2>

<div class="grid">

  <div class="card">
    <h3>$5 Tier</h3>
    <p>1 Listing</p>
    <button onclick="pay('$5 Tier')">Purchase</button>
  </div>

  <div class="card">
    <h3>$10 Tier</h3>
    <p>5 Listings</p>
    <button onclick="pay('$10 Tier')">Purchase</button>
  </div>

  <div class="card">
    <h3>$20 Tier</h3>
    <p>15 Listings</p>
    <button onclick="pay('$20 Tier')">Purchase</button>
  </div>

  <div class="card">
    <h3>$50 Tier</h3>
    <p>Unlimited Listings</p>
    <button onclick="pay('$50 Tier')">Purchase</button>
  </div>

</div>

<script>
function pay(tier) {
  // Simulated payment → redirect to success page
  window.location.href = "payment-success.html?tier=" + encodeURIComponent(tier);
}
</script>

</body>
</html>
