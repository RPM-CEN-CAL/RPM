<script>
const menuBtn = document.querySelector('.header-left');
const sideMenu = document.getElementById('sideMenu');

menuBtn.addEventListener('click', () => {
    sideMenu.classList.toggle('menu-open');
});

const dropdownButtons = document.querySelectorAll('.dropdown-btn');

dropdownButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const container = btn.nextElementSibling;

        document.querySelectorAll('.dropdown-container').forEach(drop => {
            if (drop !== container) drop.style.display = "none";
        });

        container.style.display = container.style.display === "block" ? "none" : "block";
    });
});

const postForm = document.getElementById('postForm');
const statusEl = document.getElementById('status');
const creditInfoEl = document.getElementById('creditInfo');

let canPost = false;
let unlimited = false;

async function checkCredits() {
  creditInfoEl.textContent = "Checking your listing creditsâ€¦";

  const { data: userData, error: userError } = await supabase.auth.getUser();
  if (userError || !userData || !userData.user) {
    creditInfoEl.textContent = "You must log in and purchase credits first (membership page).";
    canPost = false;
    return;
  }

  const userId = userData.user.id;

  const { data: creditRows, error: creditError } = await supabase
    .from('credits')
    .select('*')
    .eq('user_id', userId);

  if (creditError) {
    creditInfoEl.textContent = "Error checking credits: " + creditError.message;
    canPost = false;
    return;
  }

  if (!creditRows || creditRows.length === 0) {
    creditInfoEl.textContent = "No credits found. Go to listing payment to buy a tier.";
    canPost = false;
    return;
  }

  let totalCredits = 0;
  creditRows.forEach(row => {
    if (row.credits === -1) unlimited = true;
    else totalCredits += row.credits;
  });

  if (unlimited) {
    creditInfoEl.textContent = "Unlimited listings active.";
    canPost = true;
  } else if (totalCredits > 0) {
    creditInfoEl.textContent = "You have " + totalCredits + " listing credits remaining.";
    canPost = true;
  } else {
    creditInfoEl.textContent = "No remaining credits. Purchase more to post.";
    canPost = false;
  }
}

checkCredits();

postForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!canPost) {
    statusEl.textContent = "Cannot publish: no credits or not logged in.";
    return;
  }

  statusEl.textContent = "Publishing listingâ€¦";

  const { data: userData, error: userError } = await supabase.auth.getUser();
  if (userError || !userData || !userData.user) {
    statusEl.textContent = "You must be logged in.";
    return;
  }

  const userId = userData.user.id;

  const title = document.getElementById('title').value.trim();
  const category = document.getElementById('category').value;
  const make = document.getElementById('make').value.trim();
  const model = document.getElementById('model').value.trim();
  const year = document.getElementById('year').value ? parseInt(document.getElementById('year').value) : null;
  const hours = document.getElementById('hours').value ? parseInt(document.getElementById('hours').value) : null;
  const fuel = document.getElementById('fuel').value;
  const condition = document.getElementById('condition').value;
  const serial = document.getElementById('serial').value.trim();
  const attachments = document.getElementById('attachments').value.trim();
  const features = document.getElementById('features').value.trim();
  const description = document.getElementById('description').value.trim();
  const location = document.getElementById('location').value.trim();
  const price = parseFloat(document.getElementById('price').value);
  const contact = document.getElementById('contact').value.trim();

  const { error: insertError } = await supabase
    .from('listings')
    .insert({
      user_id: userId,
      title,
      category,
      make,
      model,
      year,
      hours,
      fuel,
      condition,
      serial,
      attachments,
      features,
      description,
      location,
      price,
      contact,
      created_at: new Date().toISOString()
    });

  if (insertError) {
    statusEl.textContent = "Error publishing listing: " + insertError.message;
    return;
  }

  if (!unlimited) {
    const { data: creditRows, error: creditError } = await supabase
      .from('credits')
      .select('*')
      .eq('user_id', userId)
      .gt('credits', 0)
      .limit(1);

    if (!creditError && creditRows && creditRows.length > 0) {
      const row = creditRows[0];
      await supabase
        .from('credits')
        .update({ credits: row.credits - 1 })
        .eq('id', row.id);
    }
  }

  statusEl.textContent = "Listing published successfully.";
  postForm.reset();
  unlimited = false;
  canPost = false;
  checkCredits();
});
</script>
