<body>

<div class="container">
  <h2>Pay $2 â€” Small B2B Promotion</h2>
  <p style="margin-top:10px;">
    This payment activates your business listing on Pro Equipment Exchange.<br>
    Once paid, your business will appear in the B2B section.
  </p>

  <!-- Placeholder for Square Web Payments SDK integration -->
  <p style="margin-top:15px; font-size:0.9rem; color:#555;">
    Secure payment via Square will be integrated here.
  </p>

  <button id="simulatePayBtn">Simulate $2 Payment (Dev Mode)</button>
</div>

<script>
document.getElementById("simulatePayBtn").addEventListener("click", async () => {
  const user = (await supabase.auth.getUser()).data.user;
  if (!user) {
    alert("You must be logged in.");
    return;
  }

  // Find the most recent inactive B2B listing for this user
  const { data, error } = await supabase
    .from("b2b_listings")
    .select("*")
    .eq("user_id", user.id)
    .eq("is_active", false)
    .order("created_at", { ascending: false })
    .limit(1);

  if (error || !data || data.length === 0) {
    alert("No pending B2B listing found.");
    return;
  }

  const listingId = data[0].id;

  // Activate the listing (simulating successful payment)
  const { error: updateError } = await supabase
    .from("b2b_listings")
    .update({ is_active: true })
    .eq("id", listingId);

  if (updateError) {
    alert("Error activating B2B listing: " + updateError.message);
    return;
  }

  alert("Payment successful! Your business is now listed.");
  window.location.href = "b2b-listings.html";
});
</script>
