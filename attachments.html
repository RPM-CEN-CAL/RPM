<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment Attachments | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col group">
        <div class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg font-mono text-sm">RPM</span>
          <span class="group-hover:text-blue-400 transition-colors">EQUIPMENT</span>
        </div>
        <span class="text-[10px] sm:text-xs font-semibold text-slate-400 tracking-tight">
          Attachments & Implements Marketplace
        </span>
      </a>

      <div class="flex items-center space-x-4">
        <a href="index.html" class="text-xs text-slate-400 hover:text-white">&larr; Back to Home</a>
        <a href="b2b.html" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-lg transition-all">
          B2B Directory
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
    <div class="border-b border-slate-800 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold text-white">Equipment Attachments</h1>
        <p class="text-sm text-slate-400 mt-1">Buckets, augers, pallet forks, blades, and machinery implements.</p>
      </div>
      <a href="index.html#post-section" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow">
        + Post Attachment
      </a>
    </div>

    <div id="attachments-container" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full p-8 bg-slate-800/50 rounded-xl border border-slate-800 text-center text-slate-400 text-sm animate-pulse">
        Loading dynamic attachment listings...
      </div>
    </div>
  </main>

  <script>
    const RENDER_BACKEND_URL = 'https://rpm-qhrz.onrender.com';

    async function fetchAttachments() {
      const container = document.getElementById('attachments-container');
      if (!container) return;

      try {
        const response = await fetch(`${RENDER_BACKEND_URL}/api/listings`);
        if (!response.ok) throw new Error('Failed to load listings');
        
        const allListings = await response.json();

        const attachments = allListings.filter(item => {
          const category = (item.category || '').toLowerCase();
          const title = (item.title || '').toLowerCase();
          const desc = (item.description || '').toLowerCase();
          
          return category.includes('attachment') || 
                 title.includes('auger') || title.includes('fork') || title.includes('bucket') || title.includes('blade') ||
                 desc.includes('auger') || desc.includes('fork') || desc.includes('bucket') || desc.includes('blade');
        });

        if (!attachments || attachments.length === 0) {
          container.innerHTML = `
            <div class="col-span-full p-8 bg-slate-800/50 rounded-xl border border-slate-800 text-center text-slate-400 text-sm">
              No equipment attachments currently listed. <a href="index.html" class="text-blue-400 underline">Post the first attachment &rarr;</a>
            </div>`;
          return;
        }

        container.innerHTML = attachments.map(item => {
          const defaultImage = 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=800&q=80';
          const displayImg = (item.image_url && item.image_url.length > 10) ? item.image_url : defaultImage;
          const priceDisplay = item.price ? `$${Number(item.price).toLocaleString()}` : 'Contact for Price';

          return `
            <div class="bg-slate-800/90 border border-slate-700 rounded-2xl overflow-hidden hover:border-blue-500/50 transition-all flex flex-col justify-between">
              <div>
                <div class="h-48 bg-slate-900 overflow-hidden relative">
                  <img src="${displayImg}" class="w-full h-full object-cover">
                  <span class="absolute top-3 right-3 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow">
                    ${priceDisplay}
                  </span>
                </div>
                <div class="p-5 space-y-2">
                  <h3 class="font-bold text-white text-lg line-clamp-1">${item.title || 'Attachment Item'}</h3>
                  <p class="text-xs text-slate-400 line-clamp-2">${item.description || 'No description provided.'}</p>
                  <div class="text-xs text-slate-500 pt-2 border-t border-slate-700/50">
                    Location: <span class="text-slate-300">${item.location || 'Central Valley, CA'}</span> | Condition: <span class="text-slate-300">${item.condition || 'Used'}</span>
                  </div>
                </div>
              </div>
              <div class="p-5 pt-0">
                <a href="mailto:${item.seller_email || 'rpm_cen_cal@gmail.com'}?subject=Inquiry: ${encodeURIComponent(item.title || 'Attachment Listing')}" class="w-full block text-center bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-lg transition-colors">
                  Contact Seller &rarr;
                </a>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Fetch error:', err);
        container.innerHTML = `
          <div class="col-span-full p-8 bg-slate-800/50 rounded-xl border border-slate-800 text-center text-slate-400 text-sm">
            Unable to load attachments at this time. Please check backend status.
          </div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', fetchAttachments);
  </script>
</body>
</html>
