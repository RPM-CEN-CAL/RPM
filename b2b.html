<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Directory | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col group">
        <div class="text-2xl font-black text-white flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg font-mono text-sm">RPM</span>
          <span>B2B DIRECTORY</span>
        </div>
      </a>
      <div class="flex items-center gap-4">
        <a href="promote-business.html" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-xs">+ Promote Business</a>
        <a href="index.html" class="text-sm font-medium text-blue-400 hover:underline">&larr; Home</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-12 w-full space-y-8">
    <div class="text-center space-y-2">
      <h1 class="text-3xl sm:text-4xl font-black text-white">Commercial B2B Directory</h1>
      <p class="text-slate-400 text-sm max-w-xl mx-auto">Connect with verified equipment contractors, logistics partners, and commercial repair services.</p>
    </div>

    <div id="loading" class="text-center py-12 text-slate-400">Loading directory...</div>
    <div id="b2bGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
    &copy; 2026 RPM Equipment. All rights reserved.
  </footer>

  <script>
    async function fetchB2BListings() {
      const grid = document.getElementById('b2bGrid');
      const loading = document.getElementById('loading');

      try {
        const res = await fetch('https://rpm-qhrz.onrender.com/api/b2b-listings');
        const items = await res.json();

        loading.classList.add('hidden');
        grid.classList.remove('hidden');

        if (!items || items.length === 0) {
          grid.innerHTML = '<p class="col-span-full text-center text-slate-400">No B2B partners registered yet. Be the first!</p>';
          return;
        }

        grid.innerHTML = items.map(b => `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-3 flex flex-col justify-between">
            <div class="space-y-2">
              <span class="inline-block bg-blue-600/20 text-blue-400 text-xs font-bold px-2 py-0.5 rounded border border-blue-500/30">Verified Partner</span>
              <h3 class="text-xl font-bold text-white">${b.companyName || 'Commercial Partner'}</h3>
              <p class="text-xs text-blue-400 font-semibold">${b.services || 'General Services'}</p>
              <p class="text-slate-300 text-xs leading-relaxed">${b.description || 'No description provided.'}</p>
            </div>
            <a href="mailto:${b.email}" class="block text-center bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg text-xs transition-all">
              Contact Business
            </a>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        loading.textContent = 'Failed to load B2B Directory.';
      }
    }

    fetchB2BListings();
  </script>
</body>
</html>
