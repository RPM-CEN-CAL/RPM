<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment Details | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col group">
        <div class="text-2xl font-black text-white flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg font-mono text-sm">RPM</span>
          <span>EQUIPMENT DETAILS</span>
        </div>
      </a>
      <a href="index.html" class="text-sm font-medium text-blue-400 hover:underline">&larr; Back to Listings</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8 w-full">
    <div id="detailContainer" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 space-y-6">
      <p class="text-slate-400 text-sm">Loading equipment details...</p>
    </div>
  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-slate-500 text-xs">
    &copy; 2026 RPM Equipment Marketplace. All rights reserved.
  </footer>

  <script>
    async function loadDetail() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('detailContainer');

      if (!id) {
        container.innerHTML = '<p class="text-red-400 text-sm">No listing specified.</p>';
        return;
      }

      try {
        const res = await fetch(`https://rpm-qhrz.onrender.com/api/listings/${id}`);
        if (!res.ok) throw new Error('Listing not found');
        const item = await res.json();

        container.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <div>
              <span class="bg-yellow-500/20 text-yellow-400 text-xs font-bold px-2.5 py-1 rounded border border-yellow-500/30 uppercase">DEMO / EXEMPLARY LISTING</span>
              <h1 class="text-2xl md:text-3xl font-black text-white mt-2">${item.title}</h1>
              <p class="text-slate-400 text-xs">${item.category} • Posted for Exemplary Testing Purposes</p>
            </div>
            <div class="text-right">
              <p class="text-3xl font-black text-blue-400">$${item.price.toLocaleString()}</p>
            </div>
          </div>

          <!-- PRIMARY PHOTO & THUMBNAILS -->
          <div class="space-y-3">
            <img src="${item.imageUrl || 'Tools.jpg'}" class="w-full h-80 object-cover rounded-xl border border-slate-700">
            <div class="grid grid-cols-3 gap-3">
              <img src="${item.imageUrl || 'Tools.jpg'}" class="h-20 w-full object-cover rounded-lg border border-slate-700 opacity-80 hover:opacity-100">
              <img src="Vehicles.jpg" class="h-20 w-full object-cover rounded-lg border border-slate-700 opacity-80 hover:opacity-100">
              <img src="Tools.jpg" class="h-20 w-full object-cover rounded-lg border border-slate-700 opacity-80 hover:opacity-100">
            </div>
          </div>

          <!-- SPECIFICATIONS & SELLER CONTACT CARD -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-5 space-y-3">
              <h3 class="font-bold text-white text-sm uppercase text-blue-400">Machine Specifications</h3>
              <p class="text-slate-300 text-xs leading-relaxed">${item.specs || 'Standard commercial specifications apply.'}</p>
              <h3 class="font-bold text-white text-sm uppercase text-blue-400 pt-2">Full Description</h3>
              <p class="text-slate-300 text-xs leading-relaxed">${item.description}</p>
            </div>

            <div class="bg-slate-900 border border-slate-700 rounded-xl p-5 space-y-4">
              <h3 class="font-bold text-white text-sm uppercase text-blue-400">Seller & Contact Information</h3>
              <div class="space-y-2 text-xs">
                <p class="text-slate-300"><strong class="text-white">Listing Status:</strong> Exemplary Demo Card</p>
                <p class="text-slate-300"><strong class="text-white">Location:</strong> ${item.location || 'Central Valley, CA'}</p>
                <p class="text-slate-300"><strong class="text-white">Contact Info:</strong> ${item.contactInfo || 'rpm.cen.cal@gmail.com (Demo Contact)'}</p>
              </div>
              <div class="p-3 bg-slate-800 border border-slate-700 rounded-lg text-[11px] text-slate-400">
                Notice: This listing is provided for exemplary demonstration purposes and will be replaced as active client submissions arrive.
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<p class="text-red-400 text-sm">Listing not found or server error.</p>';
      }
    }

    loadDetail();
  </script>
</body>
</html>
