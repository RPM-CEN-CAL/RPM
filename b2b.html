<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Directory & Commercial Exchange | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">

  <!-- Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col group">
        <div class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg font-mono text-sm">RPM</span>
          <span class="group-hover:text-blue-400 transition-colors">EQUIPMENT</span>
        </div>
        <span class="text-[10px] sm:text-xs font-semibold text-slate-400 tracking-tight">
          Commercial B2B Directory
        </span>
      </a>

      <div class="flex items-center space-x-4">
        <a href="index.html" class="text-xs text-slate-400 hover:text-white">&larr; Back to Home</a>
        <a href="dashboard.html" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-lg">
          + List Your Business / Equipment
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
    <div class="border-b border-slate-800 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold text-white">Commercial B2B & Business Directory</h1>
        <p class="text-sm text-slate-400 mt-1">Verified commercial operations, fleet providers, and equipment dealers.</p>
      </div>
      <a href="dashboard.html" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow">
        Promote Your Business &rarr;
      </a>
    </div>

    <!-- Live Business Directory Container -->
    <div id="b2b-container" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full p-8 bg-slate-800/50 rounded-xl border border-slate-800 text-center text-slate-400 text-sm animate-pulse">
        Fetching verified business listings...
      </div>
    </div>
  </main>

  <script>
    async function fetchB2BDirectory() {
      const container = document.getElementById('b2b-container');
      
      try {
        const response = await fetch('https://rpm-qhrz.onrender.com/api/listings');
        const data = await response.json();
        const listings = Array.isArray(data) ? data : (data.listings || []);

        if (!listings || listings.length === 0) {
          container.innerHTML = `
            <div class="col-span-full p-8 bg-slate-800/50 rounded-xl border border-slate-800 text-center text-slate-400 text-sm">
              No business listings currently registered. <a href="dashboard.html" class="text-blue-400 underline">Add your business &rarr;</a>
            </div>`;
          return;
        }

        container.innerHTML = listings.map(item => {
          const defaultImage = 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=800&q=80';
          const displayImg = (item.imageUrl && item.imageUrl.startsWith('http')) ? item.imageUrl : defaultImage;

          return `
            <div class="bg-slate-800/90 border border-slate-700 rounded-2xl overflow-hidden hover:border-blue-500/50 transition-all flex flex-col justify-between">
              <div>
                <div class="h-44 bg-slate-900 overflow-hidden relative">
                  <img src="${displayImg}" class="w-full h-full object-cover">
                  <span class="absolute top-3 right-3 bg-emerald-600 text-white text-[10px] font-bold uppercase px-2.5 py-1 rounded-full shadow">
                    ${item.category || 'Commercial Provider'}
                  </span>
                </div>
                <div class="p-5 space-y-2">
                  <h3 class="font-bold text-white text-lg line-clamp-1">${item.title || 'Verified Business'}</h3>
                  <p class="text-xs text-slate-400 line-clamp-3">${item.description || 'Verified commercial equipment operator and provider.'}</p>
                </div>
              </div>
              <div class="p-5 pt-0 border-t border-slate-700/50 mt-4">
                <a href="mailto:${item.email || 'rpm.cen.cal@gmail.com'}?subject=B2B Inquiry regarding ${encodeURIComponent(item.title || 'Directory Listing')}" class="w-full block text-center bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-lg transition-colors mt-3">
                  Contact Business &rarr;
                </a>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Directory error:', err);
        container.innerHTML = `
          <div class="col-span-full p-8 bg-slate-800/50 rounded-xl border border-slate-800 text-center text-slate-400 text-sm">
            Unable to load directory at this time. Please check backend connection.
          </div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', fetchB2BDirectory);
  </script>
</body>
</html>
