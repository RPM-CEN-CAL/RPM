<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment Details | RPM Equipment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-xl font-bold text-white tracking-tight">RPM <span class="text-blue-500">EQUIPMENT</span></span>
      </a>
      <a href="post-gateway.html" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-4 py-2 rounded-lg transition-all">
        + Post Listing
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-12 mb-auto w-full">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-6">
      <div id="detail-container">
        <h1 class="text-2xl font-bold text-white mb-2" id="item-title">Equipment Listing Details</h1>
        <p class="text-slate-400 text-sm" id="item-desc">Loading detailed specifications...</p>
      </div>
      <div class="pt-6 border-t border-slate-800 flex gap-4">
        <a href="seller-dashboard.html" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-5 py-2.5 rounded-lg transition-colors">Contact Seller</a>
        <a href="javascript:history.back()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium px-5 py-2.5 rounded-lg transition-colors">← Back to Listings</a>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500">
    &copy; 2026 RPM Equipment. All rights reserved.
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get('id');
    if (itemId) {
      document.getElementById('item-title').innerText = "Equipment ID: " + itemId.toUpperCase();
      document.getElementById('item-desc').innerText = "Displaying detailed specifications for item query parameter: " + itemId;
    }
  </script>
</body>
</html>
