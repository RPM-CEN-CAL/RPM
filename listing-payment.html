<html lang="en">
<head>

<script>

    "https://qfjilrbhbcqwlrrwihcy.supabase.co",

  );
</script>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
h2 { text-align:center; margin-bottom:10px; }
p { text-align:center; }

.grid {
  max-width:800px; margin:20px auto;
  display:grid; grid-template-columns:repeat(2,1fr); gap:20px;
}
.card {
  background:#fff; padding:15px; border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}
.card h3 { margin-bottom:8px; }
.card p { margin:4px 0; font-size:0.95rem; }
button {
  margin-top:10px; width:100%; padding:10px;
  background:#0033a0; color:#fff; border:none; border-radius:6px;
  cursor:pointer;
}
button:hover { background:#00246f; }

.status { margin-top:15px; text-align:center; font-size:0.95rem; }
</style>
</head>

<body>

<h2>Listing Payment</h2>
<p id="tierText"></p>

<div class="grid">
  <div class="card">
    <h3>$5 Tier</h3>
    <p>1 Listing</p>
    <p>Non-expiring</p>
    <button onclick="purchase('5')">Purchase $5 Tier</button>
  </div>

  <div class="card">
    <h3>$10 Tier</h3>
    <p>5 Listings</p>
    <p>Non-expiring</p>
    <button onclick="purchase('10')">Purchase $10 Tier</button>
  </div>

  <div class="card">
    <h3>$20 Tier</h3>
    <p>15 Listings</p>
    <p>Non-expiring</p>
    <button onclick="purchase('20')">Purchase $20 Tier</button>
  </div>

  <div class="card">
    <h3>$50 Tier</h3>
    <p>Unlimited Listings</p>
    <p>Non-expiring</p>
    <button onclick="purchase('50')">Purchase $50 Unlimited</button>
  </div>
</div>

<div id="status" class="status"></div>

<script>
const params = new URLSearchParams(window.location.search);
const preselectedTier = params.get("tier");
const tierText = document.getElementById("tierText");
const statusEl = document.getElementById("status");

if (preselectedTier) {
  tierText.textContent = "Selected tier: $" + preselectedTier + ". Confirm your purchase below.";
} else {
  tierText.textContent = "Choose a tier to unlock listing credits.";
}

function getCreditsForTier(tier) {
  if (tier === "5") return 1;
  if (tier === "10") return 5;
  if (tier === "20") return 15;
  if (tier === "50") return -1; // unlimited
  return 0;
}

async function purchase(tier) {
  statusEl.textContent = "Processing payment (demo)â€¦";

  const { data: userData, error: userError } = await supabase.auth.getUser();
  if (userError || !userData || !userData.user) {
    statusEl.textContent = "You must be logged in from membership page first.";
    return;
  }

  const userId = userData.user.id;
  const credits = getCreditsForTier(tier);

  const { error: creditError } = await supabase
    .from('credits')
    .insert({
      user_id: userId,
      tier: tier,
      credits: credits,
      created_at: new Date().toISOString()
    });

  if (creditError) {
    statusEl.textContent = "Error saving credits: " + creditError.message;
    return;
  }

  statusEl.textContent = "Payment successful. Credits added. Redirecting to post pageâ€¦";
  setTimeout(() => {
    window.location.href = "post.html";
  }, 1500);
}
</script>

</body>
</html>
